<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanim Henna - Admin Login</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/icons/logo.png">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0A0A0A',
                        charcoal: '#1A1A1A',
                        gold: '#D4AF37',
                        ivory: '#E0E0E0'
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        script: ['Pinyon Script', 'cursive']
                    }
                }
            }
        }
    </script>
    <style>
        .text-gradient-gold {
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }
    </style>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-L90YTDNDCB"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-L90YTDNDCB');
    </script>

</head>

<body
    class="bg-dark text-ivory font-sans antialiased min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
    <!-- Live Starfield Background -->
    <canvas id="starfield" class="fixed inset-0 w-full h-full pointer-events-none z-0 opacity-100"></canvas>

    <!-- Load Config and Auth Scripts immediately for Session Guard -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <!-- Login Card -->
    <div
        class="bg-charcoal w-full max-w-sm rounded-[2rem] shadow-2xl p-8 border-t-[5px] border-gold relative overflow-hidden">

        <!-- Decorative subtle background circle -->
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-gold/10 rounded-full blur-2xl"></div>

        <div class="flex flex-col items-center mb-8 relative z-10">
            <img src="assets/icons/logo.png" alt="Hanim Henna Logo"
                class="h-28 w-28 object-contain mb-3 drop-shadow-xl hover:scale-105 transition-transform duration-500 cursor-default">
            <h1 class="text-5xl font-script text-gradient-gold mt-1">Log Masuk</h1>
            <p class="text-xs text-ivory/50 mt-3 uppercase tracking-[0.3em] font-bold">Admin</p>
        </div>

        <form id="login-form" class="space-y-5 relative z-10">
            <!-- Error message container -->
            <div id="login-error"
                class="hidden text-red-600 text-xs text-center font-semibold bg-red-50 py-3 rounded-xl border border-red-100">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 ml-1 text-ivory/80">E-mel</label>
                <input type="email" id="email" required placeholder="Contoh: admin@hanimhenna.com"
                    class="w-full px-5 py-4 rounded-2xl border-2 border-white/10 bg-dark text-white focus:bg-charcoal focus:outline-none focus:border-gold focus:ring-0 transition-colors placeholder:text-white/20">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 ml-1 text-ivory/80">Kata Laluan</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="Masukkan kata laluan anda"
                        class="w-full px-5 py-4 pr-12 rounded-2xl border-2 border-white/10 bg-dark text-white focus:bg-charcoal focus:outline-none focus:border-gold focus:ring-0 transition-colors placeholder:text-white/20">
                    <button type="button" id="toggle-password"
                        class="absolute inset-y-0 right-0 pr-4 flex items-center text-ivory/50 hover:text-gold transition-colors focus:outline-none cursor-pointer">
                        <i class="far fa-eye text-lg" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-btn"
                class="w-full mt-8 bg-gold text-dark font-bold text-lg py-4 rounded-2xl shadow-[0_8px_20px_rgb(212,175,55,0.3)] hover:brightness-110 hover:shadow-[0_4px_10px_rgb(212,175,55,0.3)] active:scale-[0.98] transition-all tracking-wide">
                Akses Sistem
            </button>
        </form>
    </div>

    <!-- Password Toggle Script -->
    <script>
        const togglePassword = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');

        if (togglePassword) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);

                if (type === 'text') {
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                } else {
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                }
            });
        }
    </script>

    <!-- Starfield script -->
    <script src="js/public.js" defer></script>
</body>

</html>
