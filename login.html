<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanim Henna - Admin Login</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        plum: '#3A2A42',
                        gold: '#D4AF37',
                        lavender: '#F4F1F8',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-lavender text-plum font-sans antialiased min-h-screen flex items-center justify-center p-6">

    <!-- Load Config and Auth Scripts immediately for Session Guard -->
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>

    <!-- Login Card -->
    <div
        class="bg-white w-full max-w-sm rounded-[2rem] shadow-xl p-8 border-t-[5px] border-gold relative overflow-hidden">

        <!-- Decorative subtle background circle -->
        <div class="absolute -top-16 -right-16 w-32 h-32 bg-gold/10 rounded-full blur-2xl"></div>

        <div class="flex flex-col items-center mb-8 relative z-10">
            <img src="assets/icons/H.jpg" alt="Hanim Henna Logo"
                class="h-24 w-24 rounded-full shadow-[0_8px_20px_rgb(58,42,66,0.15)] object-cover border-4 border-white mb-5 ring-2 ring-gold/30">
            <h1 class="text-3xl font-serif font-bold text-plum tracking-wide">Log Masuk</h1>
            <p class="text-xs text-plum/50 mt-2 uppercase tracking-[0.2em] font-bold">Zon Pentadbir</p>
        </div>

        <form id="login-form" class="space-y-5 relative z-10">
            <!-- Error message container -->
            <div id="login-error"
                class="hidden text-red-600 text-xs text-center font-semibold bg-red-50 py-3 rounded-xl border border-red-100">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 ml-1 text-plum/80">E-mel</label>
                <input type="email" id="email" required placeholder="admin@hanimhenna.com"
                    class="w-full px-5 py-4 rounded-2xl border-2 border-lavender bg-lavender/50 focus:bg-white focus:outline-none focus:border-gold focus:ring-0 transition-colors">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2 ml-1 text-plum/80">Kata Laluan</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full px-5 py-4 rounded-2xl border-2 border-lavender bg-lavender/50 focus:bg-white focus:outline-none focus:border-gold focus:ring-0 transition-colors">
            </div>

            <button type="submit" id="login-btn"
                class="w-full mt-8 bg-gold text-white font-bold text-lg py-4 rounded-2xl shadow-[0_8px_20px_rgb(212,175,55,0.3)] hover:bg-[#c4a132] hover:shadow-[0_4px_10px_rgb(212,175,55,0.3)] active:scale-[0.98] transition-all tracking-wide">
                Akses Sistem
            </button>
        </form>
    </div>

</body>

</html>
